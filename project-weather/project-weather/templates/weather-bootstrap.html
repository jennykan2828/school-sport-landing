<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HKO 9-Day Forecast</title>
    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h1 class="text-center mb-4 text-primary">Hong Kong Observatory 9-Day Forecast</h1>

        <div class="table-responsive shadow-sm rounded">
            <table class="table table-striped table-hover table-bordered align-middle mb-0">
                <thead class="table-dark">
                    <tr class="text-center">
                        <th scope="col">Day of Week</th>
                        <th scope="col">Forecast Detail</th>
                        <th scope="col">Temp High</th>
                        <th scope="col">Temp Low</th>
                        <th scope="col">Icon</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                    <tr>
                        <td class="text-center fw-bold">{{ row.week }}</td>
                        <td>{{ row.weather }}</td>
                        <td class="text-center">
                            <span class="badge bg-danger">{{ row.max_temp }}°C</span>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-primary">{{ row.min_temp }}°C</span>
                        </td>
                        <td class="text-center">
                            {% if row.icon %}
                            <img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic{{ row.icon }}.png"
                                 alt="weather icon {{ row.icon }}"
                                 width="50" height="50"
                                 class="img-fluid">
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <p class="text-muted text-center mt-3 small">
            Data source: Hong Kong Observatory Open Data API
        </p>
    </div>

    <!-- Bootstrap 5 JS bundle (optional, for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
