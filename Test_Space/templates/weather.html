<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港九天天氣預報</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --good: #4ade80;
            --bad: #f87171;
            --rain: #60a5fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .weather-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .weather-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .date-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .date {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .week {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .temp {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 8px 0 12px;
        }

        .temp span {
            font-size: 1rem;
            font-weight: 400;
            color: var(--muted);
        }

        .weather {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 14px;
            min-height: 3.2em;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .psr {
            color: var(--rain);
        }

        .action {
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
        }

        .action.good {
            background: rgba(74, 222, 128, 0.15);
            color: var(--good);
        }

        .action.bad {
            background: rgba(248, 113, 113, 0.15);
            color: var(--bad);
        }

        footer {
            text-align: center;
            margin-top: 36px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.4rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>香港九天天氣預報</h1>
            <p>資料來源：香港天文台（HKO）</p>
        </header>

        <div class="grid">
            {% for day in days %}
            <div class="weather-card">
                <div class="date-row">
                    <div class="date">{{ day.date }}</div>
                    <div class="week">{{ day.week }}</div>
                </div>
                <div class="temp">{{ day.min_temp }}° – {{ day.max_temp }}° <span>C</span></div>
                <div class="weather">{{ day.weather }}</div>
                <div class="meta">
                    <span class="psr">降雨概率：{{ day.psr }}</span>
                    <span class="action {{ 'good' if day.suitable else 'bad' }}">
                        {{ day.action }}
                    </span>
                </div>
            </div>
            {% endfor %}
        </div>

      
    </div>
</body>
</html>
